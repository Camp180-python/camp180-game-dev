name: Convert and Commit Journal PDF

on:
  push:
    paths:
      - journal.md
  workflow_dispatch:

jobs:
  convert_and_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.1.1

      - name: Install Pandoc and LaTeX
        run: sudo apt-get install -y pandoc texlive-xetex

      - name: Convert Markdown to PDF
        run: |
          pandoc journal.md -o journal.pdf \
            --pdf-engine=xelatex \
            -V geometry:margin=1in \
            -V fontsize=11pt

      - name: Commit PDF back to repo
        run: |
          git config user.name "Camp180 Bot"
          git config user.email "bot@camp180.co.za"
          git add journal.pdf
          git commit -m "Auto-update: journal.pdf generated from journal.md" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GH_TOKEN}}@github.com/Camp180-python/camp180-game-dev.git HEAD:main
